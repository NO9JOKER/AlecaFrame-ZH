name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dictionary + bundle + OCR assets
        run: python tools/build.py

      - name: Contract checks
        run: python tools/check_contracts.py

      - name: Dictionary strict check
        run: python tools/dict.py check --strict

      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_dictlib.py"

      - name: Python syntax
        run: python -m py_compile tools/*.py

      - name: Node tests
        run: |
          node tests/runtime.test.mjs
          node tests/rules.test.mjs
          node tests/search-feature.test.mjs

      - name: JS syntax
        run: |
          find src/runtime src/ocr -name '*.js' -print0 | xargs -0 -n1 node --check
          find bin/ocr -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: PowerShell UTF-8 BOM
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "*.ps1", "*.psm1"], text=True).splitlines()
          bad = []
          for path in files:
              with open(path, "rb") as handle:
                  if handle.read(3) != b"\xef\xbb\xbf":
                      bad.append(path)
          if bad:
              raise SystemExit("missing UTF-8 BOM: " + ", ".join(bad))
          print("ps1/psm1 BOM ok:", len(files))
          PY

      - name: Generated artifacts must not be tracked
        run: |
          if git ls-files --error-unmatch bin/alecaframe-zh-cn.js >/dev/null 2>&1; then
            echo "generated bundle is tracked" >&2
            exit 1
          fi
          if [ -n "$(git ls-files bin/ocr)" ]; then
            echo "generated OCR assets are tracked" >&2
            exit 1
          fi
          echo "generated artifacts untracked"
