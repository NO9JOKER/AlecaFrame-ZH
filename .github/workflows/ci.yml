name: ci

on:
  push:
    branches:
      - dev
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and contracts
        run: |
          python tools/build.py
          python tools/check_contracts.py
          python tools/golden.py verify
          python tools/dict.py check --strict
          python -m unittest discover -s tests -p "test_dictlib.py"

      - name: Runtime tests
        run: |
          node tests/runtime.test.mjs
          node tests/rules.test.mjs
          node tests/search-feature.test.mjs
          node tests/riven-search-coverage.test.mjs
          node tests/riven-app-hook.test.mjs
