name: release

on:
  # 推送到 main 后自动发布：VERSION 对应的 tag 不存在时，才构建并创建 Release。
  push:
    branches:
      - main
  # 也支持在 Actions 页面手动触发（选择 main 分支）。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure main branch
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "release only runs on main (current: $GITHUB_REF_NAME)" >&2
            exit 1
          }

      - name: Read VERSION and check existing tag
        id: version
        run: |
          VERSION="$(python3 -c "import pathlib; print(pathlib.Path('VERSION').read_text(encoding='utf-8-sig').strip())")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version: v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag v$VERSION already exists; skip release (CI only)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is a new release"
          fi

      - uses: actions/setup-python@v5
        if: steps.version.outputs.skip == 'false'
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip == 'false'
        with:
          node-version: "20"

      - name: Build and test
        if: steps.version.outputs.skip == 'false'
        run: |
          python tools/build.py
          python tools/check_contracts.py
          python tools/golden.py verify
          python tools/dict.py check --strict
          python -m unittest discover -s tests -p "test_dictlib.py"
          node tests/runtime.test.mjs
          node tests/rules.test.mjs
          node tests/search-feature.test.mjs
          node tests/riven-search-coverage.test.mjs
          node tests/riven-app-hook.test.mjs

      - name: Package
        if: steps.version.outputs.skip == 'false'
        run: |
          python tools/package.py --version "${{ steps.version.outputs.version }}" \
            --name "AlecaFrame-ZH-${{ steps.version.outputs.version }}" --out dist --zip

      # tag 与 Release 都由 GITHUB_TOKEN 创建，不会再触发本工作流。
      - name: Create tag and release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.zip
          generate_release_notes: true
          make_latest: true
